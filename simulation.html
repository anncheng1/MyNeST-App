<style>
:root {
  --bg: #0a1628;
  --surface: #111e35;
  --surface2: #172340;
  --border: #1e3050;
  --navy: #1B3A6B;
  --teal: #1a7a8a;
  --amber: #c07a00;
  --amber-bg: #2a1f00;
  --amber-light: #ffd580;
  --green: #1a7a4a;
  --green-bg: #0d2018;
  --purple: #6b3fa0;
  --purple-bg: #1a0d2a;
  --red: #b02020;
  --text: #e8edf5;
  --text2: #8a9bb8;
  --text3: #5a6f8a;
  --gold: #f0c040;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }

/* ── Header ── */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 20px; font-size: 14px; text-decoration: none; white-space: nowrap; }
.header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
.header .sub { font-size: 12px; color: var(--text2); }

/* ── Case Grid ── */
.case-grid { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 0 auto; }
.session-label { grid-column: 1/-1; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 0 2px; }
.case-btn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
.case-btn:active { background: var(--surface2); }
.case-btn.full { grid-column: 1/-1; }
.case-id { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 4px; }
.case-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
.case-tag { font-size: 11px; color: var(--text2); margin-top: 3px; }
.c-navy .case-id { color: #6a9fd8; }
.c-navy { border-color: #1B3A6B; }
.c-teal .case-id { color: #40c0c8; }
.c-teal { border-color: #1a7a8a; }
.c-amber .case-id { color: var(--amber-light); }
.c-amber { border-color: #7a5000; }
.c-green .case-id { color: #40c080; }
.c-green { border-color: #1a7a4a; }
.c-purple .case-id { color: #b090d0; }
.c-purple { border-color: #6b3fa0; }
.c-red .case-id { color: #e07070; }
.c-red { border-color: #b02020; }

/* ── Case View ── */
.case-view { display: none; padding: 0 0 80px; max-width: 700px; margin: 0 auto; }
.case-view.active { display: block; }

.case-header { padding: 16px; background: linear-gradient(135deg, #1a1000, #2a1a00); border-bottom: 2px solid var(--amber); margin-bottom: 0; }
.case-header .case-id-lg { font-size: 12px; font-weight: 700; color: var(--amber-light); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.case-header h2 { font-size: 18px; font-weight: 800; color: var(--gold); line-height: 1.3; }

.vitals-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; }
.vitals-bar h3 { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.vitals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.vital-item { background: var(--surface2); border-radius: 6px; padding: 7px 10px; }
.vital-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.vital-val { font-size: 14px; font-weight: 700; color: var(--text); }

/* Live Vitals Panel */
.live-panel { background: #000d18; border: 1px solid var(--teal); border-radius: var(--radius); margin: 16px; padding: 14px; }
.live-panel-title { font-size: 11px; color: var(--teal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.live-panel-title::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.live-vitals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.live-vital { background: var(--surface); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
.lv-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.lv-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.lv-value.hr { color: #ff6060; }
.lv-value.spo2 { color: #40c8ff; }
.lv-value.fio2 { color: #80d080; }
.lv-unit { font-size: 11px; color: var(--text3); margin-top: 2px; }

.phase-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.phase-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .15s; }
.phase-btn:active { background: var(--teal); border-color: var(--teal); color: #fff; }
.phase-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }

/* Sections */
.section { margin: 0 16px 14px; }
.section-head { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
.section-head .icon { font-size: 13px; }

/* Presentation */
.presentation { background: var(--surface); border-radius: var(--radius-sm); padding: 13px; border-left: 3px solid var(--teal); font-size: 14px; line-height: 1.65; color: var(--text); }
.presentation + .presentation { margin-top: 6px; }

/* Think-Through-It */
.think-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.think-item { background: #0d1e35; border: 1px solid #1a3a5a; border-radius: var(--radius-sm); padding: 10px 12px; display: flex; gap: 10px; font-size: 13px; line-height: 1.5; }
.think-num { font-weight: 800; color: var(--teal); flex-shrink: 0; font-size: 14px; }
.think-text { color: #b8d0e8; font-style: italic; }

/* Discussion Table */
.disc-table { background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
.disc-table-head { display: grid; grid-template-columns: 1fr 2fr; background: #1a2e4a; }
.disc-th { font-size: 11px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 12px; }
.disc-row { display: grid; grid-template-columns: 1fr 2fr; border-top: 1px solid var(--border); }
.disc-row:nth-child(even) { background: #0e1a2e; }
.disc-aspect { padding: 10px 12px; font-size: 12px; font-weight: 700; color: #7ab8e0; line-height: 1.4; }
.disc-points { padding: 10px 12px; font-size: 13px; color: var(--text); line-height: 1.6; }
.disc-points .kp { display: block; margin-bottom: 4px; }
.disc-points .kp:last-child { margin-bottom: 0; }

/* Debrief Table */
.debrief-table { background: var(--purple-bg); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid #3a1f60; }
.debrief-table-head { display: grid; grid-template-columns: 1fr 2fr; background: #2a1050; }
.debrief-th { font-size: 11px; font-weight: 700; color: #b090d0; text-transform: uppercase; letter-spacing: 0.06em; padding: 9px 12px; }
.debrief-row { display: grid; grid-template-columns: 1fr 2fr; border-top: 1px solid #2a1050; }
.debrief-row:nth-child(even) { background: #15082a; }
.debrief-topic { padding: 10px 12px; font-size: 12px; font-weight: 700; color: #c0a0e0; line-height: 1.4; }
.debrief-prompt { padding: 10px 12px; font-size: 13px; color: #d0c0e8; line-height: 1.6; font-style: italic; }

/* Leads-Into */
.leads-into { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 13px; font-size: 12px; color: var(--text2); border-left: 3px solid var(--border); }
.leads-into strong { color: var(--text); }

/* Info Box */
.info-box { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.65; margin-bottom: 10px; }
.info-box.green { background: var(--green-bg); border: 1px solid #1a7a4a; border-left: 3px solid #40c080; }
.info-box.amber { background: var(--amber-bg); border: 1px solid #7a5000; border-left: 3px solid var(--amber-light); }
.info-box.navy { background: #0a1628; border: 1px solid var(--navy); border-left: 3px solid #6a9fd8; }
.info-box-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.info-box.green .info-box-title { color: #40c080; }
.info-box.amber .info-box-title { color: var(--amber-light); }
.info-box.navy .info-box-title { color: #6a9fd8; }
.info-box ul { padding-left: 16px; }
.info-box li { margin-bottom: 4px; }

/* Sim pathway */
.pathway { background: #001810; border: 1px solid var(--green); border-radius: var(--radius-sm); padding: 12px 14px; }
.pathway-title { font-size: 11px; font-weight: 700; color: #40c080; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.pathway-step { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #b0e0c0; }
.pathway-step .arrow { color: #40c080; flex-shrink: 0; margin-top: 1px; }

/* Nav */
.case-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; max-width: 700px; margin: 0 auto; }
.nav-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 10px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; }
.nav-btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
.nav-btn:disabled { opacity: .3; cursor: default; }

.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }

/* ── Timer Engine (Integrative Cases) ── */
.timer-panel { background: #000d18; border: 1px solid var(--teal); border-radius: var(--radius); margin: 16px; padding: 14px; }
.timer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.timer-title { font-size: 11px; color: var(--teal); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.timer-clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; text-align: center; letter-spacing: 0.02em; }
.timer-stage { text-align: center; font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 6px; min-height: 16px; }
.timer-sub { text-align: center; font-size: 11px; color: var(--text2); margin-bottom: 10px; }
.timer-controls { display: flex; gap: 8px; margin-bottom: 4px; }
.timer-btn { flex: 1; background: var(--teal); border: none; color: #001018; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.timer-btn.secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.timer-btn:disabled { opacity: .35; }
.prep-bars { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.prep-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.prep-bar-label { width: 100px; flex-shrink: 0; color: var(--text2); }
.prep-bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.prep-bar-fill { height: 100%; background: var(--teal); width: 0%; transition: width .3s linear; }
.prep-bar-fill.over { background: var(--red); }
.prep-bar-time { width: 46px; text-align: right; color: var(--text3); font-variant-numeric: tabular-nums; }

.alert-banner { display: none; background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--radius-sm); padding: 10px 14px; margin: 0 16px 12px; font-size: 13px; color: var(--amber-light); font-weight: 700; }
.alert-banner.show { display: block; animation: alertFlash 1s ease-in-out 2; }
@keyframes alertFlash { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

.live-vitals3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.checkpoint-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.checkpoint { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.checkpoint.due { border-color: var(--amber); }
.checkpoint.resolved { opacity: .55; }
.cp-time { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; }
.cp-label { font-size: 13px; color: var(--text); margin: 3px 0 8px; line-height: 1.4; }
.cp-actions { display: flex; gap: 8px; }
.cp-btn { flex: 1; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid; }
.cp-btn.correct { background: var(--green-bg); border-color: var(--green); color: #6adba0; }
.cp-btn.correct.picked { background: var(--green); color: #002010; }
.cp-btn.incorrect { background: var(--amber-bg); border-color: var(--amber); color: var(--amber-light); }
.cp-btn.incorrect.picked { background: var(--amber); color: #2a1a00; }
.cp-note { font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text2); font-style: italic; }

.role-panel { background: #000d18; border: 1px solid var(--teal); border-radius: var(--radius); margin: 16px; padding: 16px; }
.role-panel h3 { color: var(--teal); font-size: 14px; margin-bottom: 10px; }
.flow-chain { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 16px; font-size: 12px; }
.flow-step { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; text-align: center; width: 100%; max-width: 320px; }
.flow-step.highlight { background: var(--teal); color: #001812; font-weight: 700; border-color: var(--teal); }
.flow-arrow { color: var(--text3); font-size: 13px; }
.role-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
.role-table th, .role-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
.role-table th { background: var(--surface2); color: var(--teal); font-size: 10.5px; text-transform: uppercase; }
.role-table td.block-cell { font-weight: 700; color: var(--gold); white-space: nowrap; }
.role-legend { font-size: 11px; color: var(--text3); margin-top: 8px; }

.opening-seq { background: var(--surface); border: 1px solid var(--teal); border-radius: var(--radius); margin-bottom: 16px; padding: 14px; }
.opening-seq h3 { color: var(--teal); font-size: 13px; margin-bottom: 8px; }
.os-step { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
.os-step:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.os-step-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.os-clock { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); }
.os-clock.done { color: var(--green); }
.os-btn { background: var(--teal); color: #001812; border: none; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; }
.os-btn:disabled { opacity: .4; }
.os-timer-hint { font-size: 10px; color: var(--text2); text-align: center; margin-top: 5px; opacity: .7; }
.os-checklist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.os-check-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 8px; background: var(--surface2); border-radius: 6px; cursor: pointer; }
.os-check-item.ticked { background: var(--green-bg); color: #6ee7b7; }
.os-check-item input { accent-color: var(--teal); }
.os-qa-btns { display: flex; gap: 8px; margin-top: 6px; }
.os-qa-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
.os-qa-btn.picked { background: var(--teal); color: #001812; border-color: var(--teal); }
.os-dcc-result { font-size: 12px; color: var(--text2); margin-top: 6px; font-style: italic; }
.debrief-final { border: 2px solid var(--gold); border-radius: var(--radius); background: rgba(240,192,64,0.06); }
.debrief-final .section-head { color: var(--gold); }
</style>

<body>

<div id="gridView">
  <div class="header">
    <a href="index.html" class="back-btn">← Home</a>
    <div>
      <div class="header h1">Simulation Mode</div>
      <div class="sub">All Cases · Structured Discussion</div>
    </div>
    <button class="back-btn" style="margin-left:auto" onclick="toggleRolePanel()">📋 Team Roles &amp; Flow</button>
  </div>

  <div id="rolePanel" style="display:none"></div>

  <div class="case-grid" id="caseGrid"></div>
</div>

<div id="caseView" style="display:none">
  <div class="header">
    <button class="back-btn" onclick="showGrid()">← Cases</button>
    <div>
      <div class="header h1" id="cvTitle">Case</div>
      <div class="sub" id="cvSub"></div>
    </div>
  </div>
  <div class="case-view active" id="cvContent"></div>
  <nav class="case-nav" id="caseNav">
    <button class="nav-btn" id="prevBtn" onclick="navCase(-1)">◀ Prev</button>
    <button class="nav-btn primary" onclick="showGrid()">All Cases</button>
    <button class="nav-btn" id="nextBtn" onclick="navCase(1)">Next ▶</button>
  </nav>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// CASE DATA
// ══════════════════════════════════════════════════════════════════════════
const CASES = [

// ── SESSION 1 ─────────────────────────────────────────────────────────────
{
  id: 'A1', title: 'The Vigorous Baby — Does She Need Resuscitation?',
  color: 'c-teal', session: 'Block A (Airway) · Receiving the Baby & Initial Steps',
  tag: 'DCC · Receiving technique · Initial assessment',
  presentation: [
    'A 39-week baby girl is delivered by spontaneous vaginal delivery. The midwife receives her and places her on the mother\'s abdomen. She cries loudly immediately, moves all four limbs actively, and has good central colour.',
    'The junior doctor asks: "Should we cut the cord now? What do we do next?"',

  'Receive referral', 'Ask 4 pre-birth questions', 'Identify risk', 'Need more help?',
  'Cord management plan', 'Equipment preparation', 'Team briefing', 'Baby delivered',
  '3 assessment questions', 'Cord management', 'Initial steps', "Continue to today's learning objective",
];

const ROLE_PROGRESSION = [
  { block: 'Block A', team: '3 (Leader + 1 Assistant)',
    leader: 'Airway, assessment, decision-making, delegation',
    a1: 'Turn on Apgar timer; assist stabilisation of head',
    a2: 'Dry and remove wet linen',
    a3: '—' },
  { block: 'Block B', team: '3–4',
    leader: 'Airway, assessment, decision-making, delegation',
    a1: 'Apgar timer; apply pulse oximeter; assist head stabilisation; give free-flow oxygen',
    a2: 'Dry/remove wet linen; auscultate HR; prepare suction for intubation; check air entry to confirm ETT position',
    a3: 'Optional — scribe and timekeeper' },
  { block: 'Block C', team: '4 (recommended)',
    leader: 'Airway, assessment, decision-making, delegation',
    a1: 'All Block B actions, plus chest compressions',
    a2: 'All Block B actions, plus prepare medication and umbilical line',
    a3: 'Scribe and timekeeper — now guiding the scenario timer' },
  { block: 'Block D', team: '4 (recommended)',
    leader: 'Airway, assessment, decision-making, delegation',
    a1: 'All Block C actions (compressions when indicated)',
    a2: 'All Block C actions, plus medication administration and UVC assistance',
    a3: 'Scribe and timekeeper' },
  { block: 'Block E', team: '4 (recommended)',
    leader: 'Full team coordination — airway, assessment, decision-making, delegation across special situations',
    a1: 'Full role: Apgar timer, SpO₂, head stabilisation, free-flow O₂, chest compressions',
    a2: 'Full role: drying, auscultation, suction, ETT confirmation, medication, umbilical line',
    a3: 'Scribe and timekeeper — full documentation and timing' },
];

function toggleRolePanel() {
  const panel = document.getElementById('rolePanel');
  if (panel.style.display === 'none') {
    panel.innerHTML = buildRolePanelHTML();
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}

function buildRolePanelHTML() {
  let html = '<div class="role-panel">';
  html += '<h3>Standard Opening — Every Simulation Begins Identically</h3>';
  html += '<div class="flow-chain">';
  FLOW_STEPS.forEach((step, i) => {
    html += `<div class="flow-step${i===FLOW_STEPS.length-1 ? ' highlight' : ''}">${step}</div>`;
    if (i < FLOW_STEPS.length-1) html += '<div class="flow-arrow">↓</div>';
  });
  html += '</div>';

  html += '<h3>Progressive Role Expansion — Rotate Who Holds Each Role</h3>';
  html += '<table class="role-table"><tr><th>Block</th><th>Team Leader</th><th>Assistant 1</th><th>Assistant 2</th><th>Assistant 3</th></tr>';
  ROLE_PROGRESSION.forEach(r => {
    html += `<tr><td class="block-cell">${r.block}<br><span style="font-weight:400;color:var(--text3)">(${r.team})</span></td><td>${r.leader}</td><td>${r.a1}</td><td>${r.a2}</td><td>${r.a3}</td></tr>`;
  });
  html += '</table>';
  html += '<div class="role-legend">Assistant 3 (scribe/timekeeper) joins once the team has grown to 4 — optional but recommended from Block B onward. Rotate roles after every case so everyone leads.</div>';
  html += '</div>';
  return html;
}

// ── Standard Opening Sequence (every case begins identically) ───────────────
const EQUIP_CHECKLIST = [
  'WARM — warmer pre-heated, warm towels, hat ready',
  'CLEAR — suction catheter correct size, wall suction 80–100 mmHg',
  'VENTILATE — T-piece/BVM ready, correct mask size, PIP 20/PEEP 5 set',
  'OXYGENATE — blender connected, FiO₂ set per gestation',
  'INTUBATE — laryngoscope tested, correct ETT size, tape ready',
  'MEDICATE — adrenaline drawn up, UVC tray ready (if anticipated)',
];

let OS = null; // opening-sequence state, one per open case

function initOpeningSequence(c) {
  if (OS) { clearInterval(OS.equipInterval); clearInterval(OS.briefInterval); clearInterval(OS.initialInterval); }
  OS = {
    equipInterval: null, equipElapsed: 0, equipDone: false,
    briefInterval: null, briefElapsed: 0, briefDone: false,
    initialInterval: null, initialElapsed: 0, initialDone: false,
    checklist: EQUIP_CHECKLIST.map(() => false),
    assistantsCalled: false,
    assessAnswers: { term: null, tone: null, breathing: null },
    dccDecision: null,
  };
}

function osToggleInitial() {
  if (OS.initialInterval) {
    clearInterval(OS.initialInterval);
    OS.initialInterval = null;
  } else {
    OS.initialInterval = setInterval(() => {
      OS.initialElapsed += 1;
      if (OS.initialElapsed >= 60) { OS.initialDone = true; clearInterval(OS.initialInterval); OS.initialInterval = null; }
      renderOpeningSequence();
    }, 1000);
  }
  renderOpeningSequence();
}

function osResetInitial() {
  clearInterval(OS.initialInterval);
  OS.initialInterval = null;
  OS.initialElapsed = 0;
  OS.initialDone = false;
  renderOpeningSequence();
}

function osFmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function osCallAssistants() {
  OS.assistantsCalled = true;
  renderOpeningSequence();
}

function osToggleCheck(i) {
  OS.checklist[i] = !OS.checklist[i];
  renderOpeningSequence();
}

function osToggleEquip() {
  if (OS.equipInterval) {
    clearInterval(OS.equipInterval);
    OS.equipInterval = null;
  } else {
    OS.equipInterval = setInterval(() => {
      OS.equipElapsed += 1;
      if (OS.equipElapsed >= 300) { OS.equipDone = true; clearInterval(OS.equipInterval); OS.equipInterval = null; }
      renderOpeningSequence();
    }, 1000);
  }
  renderOpeningSequence();
}

function osResetEquip() {
  clearInterval(OS.equipInterval);
  OS.equipInterval = null;
  OS.equipElapsed = 0;
  OS.equipDone = false;
  renderOpeningSequence();
}

function osToggleBrief() {
  if (OS.briefInterval) {
    clearInterval(OS.briefInterval);
    OS.briefInterval = null;
  } else {
    OS.briefInterval = setInterval(() => {
      OS.briefElapsed += 1;
      if (OS.briefElapsed >= 180) { OS.briefDone = true; clearInterval(OS.briefInterval); OS.briefInterval = null; }
      renderOpeningSequence();
    }, 1000);
  }
  renderOpeningSequence();
}

function osResetBrief() {
  clearInterval(OS.briefInterval);
  OS.briefInterval = null;
  OS.briefElapsed = 0;
  OS.briefDone = false;
  renderOpeningSequence();
}

function osAnswer(q, val) {
  OS.assessAnswers[q] = val;
  renderOpeningSequence();
}

function osDecideDCC() {
  const a = OS.assessAnswers;
  if (a.term === null || a.tone === null || a.breathing === null) return;
  OS.dccDecision = (a.term === 'Yes' && a.tone === 'Good' && a.breathing === 'Yes') ? 'dcc' : 'initial';
  renderOpeningSequence();
}

function buildOpeningSequenceHTML(c) {
  const blockLetter = c.id.match(/^([A-E])/) ? c.id.match(/^([A-E])/)[1] : null;
  const blockIdx = {A:0,B:1,C:2,D:3,E:4}[blockLetter];
  const r = blockIdx !== undefined ? ROLE_PROGRESSION[blockIdx] : null;

  let html = '<div class="opening-seq">';
  html += '<h3>Standard Opening Sequence</h3>';

  // Step 1: Pre-birth questions (from case presentation) + risk + call for assistants
  html += `<div class="os-step">
    <div class="os-step-title">1 · Four Pre-Birth Questions &amp; Risk Identification</div>
    <div style="font-size:12px;color:var(--text2);line-height:1.5">${c.presentation ? c.presentation[0] : ''}</div>
    <button class="os-btn" style="margin-top:8px" onclick="osCallAssistants()" ${OS.assistantsCalled?'disabled':''}>${OS.assistantsCalled ? '✓ Assistants Called' : 'Risk Identified — Call for Assistants'}</button>
  </div>`;

  // Step 2: Equipment prep (5 min + checklist)
  html += `<div class="os-step">
    <div class="os-step-title">2 · Equipment Preparation (target 5 min)</div>
    <div class="os-clock${OS.equipDone?' done':''}">${osFmtClock(OS.equipElapsed)}</div>
    <button class="os-btn" onclick="osToggleEquip()" ondblclick="osResetEquip()">${OS.equipInterval ? '⏸ Pause Equipment Timer' : (OS.equipDone ? '✓ Complete — tap to resume · double-tap to reset' : (OS.equipElapsed>0 ? '▶ Resume Equipment Timer' : '▶ Start Equipment Timer'))}</button>
    <div class="os-timer-hint">Tap to start/stop · double-tap to reset</div>
    <div class="os-checklist">
      ${EQUIP_CHECKLIST.map((item,i) => `<div class="os-check-item${OS.checklist[i]?' ticked':''}" onclick="osToggleCheck(${i})"><input type="checkbox" ${OS.checklist[i]?'checked':''} readonly> ${item}</div>`).join('')}
    </div>
  </div>`;

  // Step 3: Team briefing (3 min + progressive instructions)
  html += `<div class="os-step">
    <div class="os-step-title">3 · Team Briefing (target 3 min)</div>
    <div class="os-clock${OS.briefDone?' done':''}">${osFmtClock(OS.briefElapsed)}</div>
    <button class="os-btn" onclick="osToggleBrief()" ondblclick="osResetBrief()">${OS.briefInterval ? '⏸ Pause Briefing Timer' : (OS.briefDone ? '✓ Complete — tap to resume · double-tap to reset' : (OS.briefElapsed>0 ? '▶ Resume Briefing Timer' : '▶ Start Briefing Timer'))}</button>
    <div class="os-timer-hint">Tap to start/stop · double-tap to reset</div>
    ${r ? `<div style="font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5">
      <strong>Instructions so far (${r.block} and everything before it):</strong><br>
      Team Leader: ${r.leader}<br>Assistant 1: ${r.a1}<br>Assistant 2: ${r.a2}<br>Assistant 3: ${r.a3}
    </div>` : ''}
  </div>`;

  // Step 4: Receiving baby - 3 assessment questions -> DCC
  html += `<div class="os-step">
    <div class="os-step-title">4 · Receiving the Baby — 3 Assessment Questions</div>
    <div style="font-size:12px;margin-top:4px">Term?</div>
    <div class="os-qa-btns">${['Yes','No'].map(v=>`<button class="os-qa-btn${OS.assessAnswers.term===v?' picked':''}" onclick="osAnswer('term','${v}')">${v}</button>`).join('')}</div>
    <div style="font-size:12px;margin-top:8px">Good tone?</div>
    <div class="os-qa-btns">${['Good','Poor'].map(v=>`<button class="os-qa-btn${OS.assessAnswers.tone===v?' picked':''}" onclick="osAnswer('tone','${v}')">${v}</button>`).join('')}</div>
    <div style="font-size:12px;margin-top:8px">Breathing or crying?</div>
    <div class="os-qa-btns">${['Yes','No'].map(v=>`<button class="os-qa-btn${OS.assessAnswers.breathing===v?' picked':''}" onclick="osAnswer('breathing','${v}')">${v}</button>`).join('')}</div>
    <button class="os-btn" style="margin-top:8px" onclick="osDecideDCC()">Decide: DCC or Initial Steps?</button>
    ${OS.dccDecision ? `<div class="os-dcc-result">${OS.dccDecision==='dcc' ? '→ All criteria met: proceed with Delayed Cord Clamping and routine care.' : '→ Criteria not met: clamp cord, transfer to warmer, begin Initial Steps (target 1 min).'}</div>` : ''}
  </div>`;

  // Step 5: Initial steps (1 min timer)
  html += `<div class="os-step">
    <div class="os-step-title">5 · Initial Steps of Resuscitation (target 1 min)</div>
    <div class="os-clock${OS.initialDone?' done':''}">${osFmtClock(OS.initialElapsed)}</div>
    <button class="os-btn" onclick="osToggleInitial()" ondblclick="osResetInitial()">${OS.initialInterval ? '⏸ Pause Initial Steps Timer' : (OS.initialDone ? '✓ Complete — see vitals below · double-tap to reset' : (OS.initialElapsed>0 ? '▶ Resume Initial Steps Timer' : '▶ Start Initial Steps Timer'))}</button>
    <div class="os-timer-hint">Tap to start/stop · double-tap to reset</div>
  </div>`;

  html += '</div>';
  return html;
}

function renderOpeningSequence() {
  const root = document.getElementById('openingSeqRoot');
  if (!root || !OS) return;
  root.innerHTML = buildOpeningSequenceHTML(root._case);
}

// ── Build grid ─────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('caseGrid');
  SESSIONS.forEach(s => {
    const label = document.createElement('div');
    label.className = 'session-label';
    label.textContent = s.label;
    grid.appendChild(label);
    s.ids.forEach(id => {
      const c = CASES.find(x => x.id === id);
      if (!c) return;
      const isFullWidth = s.ids.length === 1 || id.startsWith('Integrative') || id === 'E3';
      const btn = document.createElement('button');
      btn.className = `case-btn ${c.color}${isFullWidth ? ' full' : ''}`;
      btn.onclick = () => openCase(CASES.indexOf(c));
      btn.innerHTML = `<div class="case-id">${c.id}</div><div class="case-title">${c.title}</div><div class="case-tag">${c.tag}</div>`;
      grid.appendChild(btn);
    });
  });
}

// ── Build case content ─────────────────────────────────────────────────────
function buildCaseHTML(c) {
  let html = '';

  // Case header
  html += `<div class="case-header"><div class="case-id-lg">CASE ${c.id}</div><h2>${c.title}</h2></div>`;

  // Active team roles for this block (skip for Integrative cases which use full team already)
  const blockLetter = c.id.match(/^([A-E])/) ? c.id.match(/^([A-E])/)[1] : null;
  const blockIdx = {A:0,B:1,C:2,D:3,E:4}[blockLetter];
  if (blockIdx !== undefined) {
    const r = ROLE_PROGRESSION[blockIdx];
    html += `<div class="role-panel" style="margin:0 0 16px">
      <h3 style="margin-bottom:6px">Active Team Roles — ${r.block} (${r.team})</h3>
      <table class="role-table">
        <tr><th>Team Leader</th><th>Assistant 1</th><th>Assistant 2</th><th>Assistant 3</th></tr>
        <tr><td>${r.leader}</td><td>${r.a1}</td><td>${r.a2}</td><td>${r.a3}</td></tr>
      </table>
    </div>`;
  }

  // Standard Opening Sequence (every case begins identically)
  html += `<div id="openingSeqRoot"></div>`;

  // At-presentation vitals
  if (c.vitals && c.vitals.length) {
    html += `<div class="vitals-bar"><h3>At Presentation</h3><div class="vitals-grid">`;
    c.vitals.forEach(v => {
      html += `<div class="vital-item"><div class="vital-label">${v.label}</div><div class="vital-val">${v.val}</div></div>`;
    });
    html += `</div></div>`;
  }

  // Timer + auto-vitals engine (Integrative Cases)
  if (c.timeline) {
    html += `<div class="timer-panel">
      <div class="timer-head"><div class="timer-title">⏱ Scenario Timer &amp; Live Vitals</div></div>
      <div id="alertBanner" class="alert-banner"></div>
      <div id="timerRoot"></div>
    </div>`;
  }

  // Live vitals panel (if phases defined)
  if (c.phases && c.phases.length) {
    html += `<div class="live-panel">
      <div class="live-panel-title">Live Vital Signs</div>
      <div class="live-vitals">
        <div class="live-vital"><div class="lv-label">HR</div><div class="lv-value hr" id="lv-hr">${c.phases[0].hr}</div><div class="lv-unit">bpm</div></div>
        <div class="live-vital"><div class="lv-label">SpO₂</div><div class="lv-value spo2" id="lv-spo2">${c.phases[0].spo2}</div><div class="lv-unit">%</div></div>
        <div class="live-vital"><div class="lv-label">FiO₂</div><div class="lv-value fio2" id="lv-fio2">${c.phases[0].fio2}</div><div class="lv-unit">%</div></div>
      </div>
      <div id="lv-note" style="font-size:12px;color:var(--teal);margin-bottom:10px;min-height:16px">${c.phases[0].note}</div>
      <div class="phase-btns">`;
    c.phases.forEach((ph, i) => {
      html += `<button class="phase-btn${i===0?' active':''}" onclick="setPhase(${JSON.stringify(c.phases).replace(/"/g,"'")},${i},this)">${ph.label}</button>`;
    });
    html += `</div></div>`;
  }

  // Clinical Presentation
  html += `<div class="section"><div class="section-head"><span class="icon">📋</span>Clinical Presentation</div>`;
  c.presentation.forEach(p => { html += `<div class="presentation">${p}</div>`; });
  html += `</div>`;

  // Think Through It
  if (c.think && c.think.length) {
    html += `<div class="section"><div class="section-head"><span class="icon">💭</span>Think Through It</div><ul class="think-list">`;
    c.think.forEach((q, i) => {
      html += `<li class="think-item"><span class="think-num">${i+1}</span><span class="think-text">${q}</span></li>`;
    });
    html += `</ul></div>`;
  }

  // Discussion Table
  if (c.discussion && c.discussion.length) {
    html += `<div class="section"><div class="section-head"><span class="icon">📖</span>Discussion</div>
    <div class="disc-table">
      <div class="disc-table-head"><div class="disc-th">Aspect</div><div class="disc-th">Key Points</div></div>`;
    c.discussion.forEach(row => {
      const pts = Array.isArray(row.points) ? row.points : [row.points];
      html += `<div class="disc-row">
        <div class="disc-aspect">${row.aspect}</div>
        <div class="disc-points">${pts.map(p => `<span class="kp">${p}</span>`).join('')}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Debrief Table
  if (c.debrief && c.debrief.length) {
    html += `<div class="section debrief-final"><div class="section-head"><span class="icon">🎓</span>6 · Debrief (End of Scenario)</div>
    <div class="debrief-table">
      <div class="debrief-table-head"><div class="debrief-th">Topic</div><div class="debrief-th">Discussion Prompts</div></div>`;
    c.debrief.forEach(row => {
      html += `<div class="debrief-row">
        <div class="debrief-topic">${row.topic}</div>
        <div class="debrief-prompt">${row.prompt}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Leads into
  if (c.leadsInto) {
    html += `<div class="section"><div class="leads-into"><strong>This case leads into:</strong> ${c.leadsInto}</div></div>`;
  }

  return html;
}

// ── Phase switching ─────────────────────────────────────────────────────────
function setPhase(phases, idx, el) {
  const ph = phases[idx];
  document.getElementById('lv-hr').textContent = ph.hr;
  document.getElementById('lv-spo2').textContent = ph.spo2;
  document.getElementById('lv-fio2').textContent = ph.fio2;
  document.getElementById('lv-note').textContent = ph.note;
  document.querySelectorAll('.phase-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
}

// ── Open / close case ──────────────────────────────────────────────────────
function openCase(idx) {
  if (TM) { clearInterval(TM.interval); TM = null; }
  currentIdx = idx;
  const c = CASES[idx];
  document.getElementById('cvTitle').textContent = `Case ${c.id}`;
  document.getElementById('cvSub').textContent = c.session;
  document.getElementById('cvContent').innerHTML = buildCaseHTML(c);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === CASES.length - 1;
  document.getElementById('gridView').style.display = 'none';
  document.getElementById('caseView').style.display = 'block';
  window.scrollTo(0, 0);
  initOpeningSequence(c);
  const osRoot = document.getElementById('openingSeqRoot');
  if (osRoot) { osRoot._case = c; renderOpeningSequence(); }
  if (c.timeline) initTimerUI(c);
}

function navCase(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < CASES.length) openCase(next);
}

function showGrid() {
  if (TM) { clearInterval(TM.interval); TM = null; }
  if (OS) { clearInterval(OS.equipInterval); clearInterval(OS.briefInterval); clearInterval(OS.initialInterval); OS = null; }
  document.getElementById('caseView').style.display = 'none';
  document.getElementById('gridView').style.display = 'block';
  window.scrollTo(0, 0);
}


// ══════════════════════════════════════════════════════════════════════════
// TIMER ENGINE — Integrative Cases (Pre-Birth Prep + Time-of-Life + Vitals)
// ══════════════════════════════════════════════════════════════════════════
const SPO2_TARGETS = { 180:'70–75%', 300:'80–85%', 600:'85–95%', 900:'≥90% (settling)' };
let TM = null; // active timer state

function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function initTimerUI(c) {
  TM = {
    case: c,
    stage: 'prep',        // 'prep' | 'life'
    prepElapsed: 0,       // seconds since prep start
    lifeElapsed: 0,       // seconds since birth
    running: false,
    interval: null,
    resolved: {},         // checkpoint index -> 'correct'|'incorrect'
    alertsFired: {},
  };
  renderTimer();
}

function timerStart() {
  if (!TM || TM.running) return;
  TM.running = true;
  TM.interval = setInterval(timerTick, 1000);
  renderTimer();
}

function timerTick() {
  if (!TM || !TM.running) return;
  if (TM.stage === 'prep') {
    TM.prepElapsed += 1;
  } else {
    TM.lifeElapsed += 1;
    [180,300,600,900].forEach(mark => {
      if (TM.lifeElapsed >= mark && !TM.alertsFired[mark]) {
        TM.alertsFired[mark] = true;
        fireAlert(mark);
      }
    });
  }
  renderTimer();
}

function fireAlert(mark) {
  const el = document.getElementById('alertBanner');
  if (!el) return;
  const mins = mark/60;
  el.textContent = `⏰ ${mins} min mark — target SpO₂ ${SPO2_TARGETS[mark] || ''}. Check HR & SpO₂, confirm team status.`;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 4000);
}

function deliverBaby() {
  if (!TM) return;
  TM.stage = 'life';
  TM.lifeElapsed = 0;
  renderTimer();
}

function resolveCheckpoint(idx, outcome) {
  if (!TM) return;
  TM.resolved[idx] = outcome;
  renderTimer();
}

function resetTimerCase() {
  if (!TM) return;
  clearInterval(TM.interval);
  initTimerUI(TM.case);
}

function currentVitals() {
  const c = TM.case;
  let hr = c.timeline.baselineHR, spo2 = c.timeline.baselineSpO2, note = c.timeline.baselineNote || 'Baseline';
  c.timeline.checkpoints.forEach((cp, i) => {
    if (TM.lifeElapsed >= cp.t && TM.resolved[i]) {
      const branch = TM.resolved[i] === 'correct' ? cp.correct : cp.incorrect;
      hr = branch.hr; spo2 = branch.spo2; note = branch.note;
    }
  });
  return { hr, spo2, note };
}

function renderTimer() {
  const root = document.getElementById('timerRoot');
  if (!root || !TM) return;
  const c = TM.case;
  const EQUIP = 300, BRIEF = 180; // 5 min, 3 min

  if (TM.stage === 'prep') {
    const eqPct = Math.min(100, TM.prepElapsed/EQUIP*100);
    const brElapsed = Math.max(0, TM.prepElapsed - EQUIP);
    const brPct = Math.min(100, brElapsed/BRIEF*100);
    root.innerHTML = `
      <div class="timer-stage">PRE-BIRTH PREPARATION</div>
      <div class="timer-clock">${fmtClock(TM.prepElapsed)}</div>
      <div class="timer-sub">Prep timer — counts up from referral received</div>
      <div class="prep-bars">
        <div class="prep-bar-row"><span class="prep-bar-label">Equipment (5m)</span><div class="prep-bar-track"><div class="prep-bar-fill${TM.prepElapsed>EQUIP?' over':''}" style="width:${eqPct}%"></div></div><span class="prep-bar-time">${fmtClock(Math.min(TM.prepElapsed,EQUIP))}</span></div>
        <div class="prep-bar-row"><span class="prep-bar-label">Briefing (3m)</span><div class="prep-bar-track"><div class="prep-bar-fill${brElapsed>BRIEF?' over':''}" style="width:${brPct}%"></div></div><span class="prep-bar-time">${fmtClock(Math.min(brElapsed,BRIEF))}</span></div>
      </div>
      <div class="timer-controls mt12">
        <button class="timer-btn secondary" onclick="${TM.running?'timerPause()':'timerStart()'}" ondblclick="resetTimerCase()">${TM.running?'⏸ Pause Prep Timer':(TM.prepElapsed>0?'▶ Resume Prep Timer':'▶ Start Prep Timer')}</button>
        <button class="timer-btn" onclick="deliverBaby()">👶 Baby Delivered — Start Time of Life</button>
      </div>
      <div class="os-timer-hint">Tap to start/stop · double-tap to reset scenario</div>`;
    return;
  }

  // stage === 'life'
  const v = currentVitals();
  const initialStepsDue = TM.lifeElapsed >= 60;
  let cpHtml = '';
  c.timeline.checkpoints.forEach((cp, i) => {
    const due = TM.lifeElapsed >= cp.t;
    const resolved = TM.resolved[i];
    cpHtml += `<div class="checkpoint${due && !resolved ? ' due' : ''}${resolved ? ' resolved' : ''}">
      <div class="cp-time">T+${fmtClock(cp.t)}</div>
      <div class="cp-label">${cp.label}</div>
      <div class="cp-actions">
        <button class="cp-btn correct${resolved==='correct'?' picked':''}" onclick="resolveCheckpoint(${i},'correct')">✓ Done correctly</button>
        <button class="cp-btn incorrect${resolved==='incorrect'?' picked':''}" onclick="resolveCheckpoint(${i},'incorrect')">✗ Not done / incorrect</button>
      </div>
      ${resolved ? `<div class="cp-note">${resolved==='correct'?cp.correct.note:cp.incorrect.note}</div>` : ''}
    </div>`;
  });

  root.innerHTML = `
    <div class="timer-stage">TIME OF LIFE${TM.running?'':' (paused)'}</div>
    <div class="timer-clock">${fmtClock(TM.lifeElapsed)}</div>
    <div class="timer-sub">${initialStepsDue ? 'Initial steps window closed — proceed per checkpoints below' : 'Initial steps of resuscitation — target: complete by 1:00'}</div>
    <div class="live-vitals3">
      <div class="live-vital"><div class="lv-label">HR</div><div class="lv-value hr">${v.hr}</div><div class="lv-unit">bpm</div></div>
      <div class="live-vital"><div class="lv-label">SpO₂</div><div class="lv-value spo2">${v.spo2}</div><div class="lv-unit">%</div></div>
    </div>
    <div style="font-size:12px;color:var(--teal);margin-bottom:6px">${v.note}</div>
    <div class="timer-controls">
      <button class="timer-btn secondary" onclick="${TM.running?'timerPause()':'timerStart()'}" ondblclick="resetTimerCase()">${TM.running?'⏸ Pause':'▶ Resume'}</button>
      <button class="timer-btn secondary" onclick="resetTimerCase()">↺ Reset Scenario</button>
    </div>
    <div class="os-timer-hint">Tap to start/stop · double-tap the timer button or use Reset Scenario</div>
    <div class="checkpoint-list">${cpHtml}</div>`;
}

function timerPause() {
  if (!TM) return;
  TM.running = false;
  clearInterval(TM.interval);
  renderTimer();
}

buildGrid();
</script>
</body>
</html>
