<style>
:root{
  --navy:#0a1628;--navy-mid:#122040;--navy-card:#1a2d50;
  --blue:#3b9eff;--teal:#00d4b4;--red:#ff4d6a;--amber:#ffb340;--green:#34d399;--purple:#a78bfa;
  --text:#e8f0fe;--text-dim:#8da4c4;--border:#243860;
  --radius:14px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:calc(80px + var(--safe-bottom));}

.topbar{background:var(--navy-mid);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.back{color:var(--blue);text-decoration:none;font-size:17px;font-weight:600;display:flex;align-items:center;gap:4px;}
.page-title{font-size:17px;font-weight:700;color:var(--text);}

.content{padding:16px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 8px;}

/* Input card */
.input-card{background:var(--navy-card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:16px;}
.input-row{display:flex;gap:12px;align-items:flex-end;}
.field{flex:1;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
.field input{width:100%;background:#0d1e3a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:700;padding:10px 12px;outline:none;-webkit-appearance:none;}
.field input:focus{border-color:var(--teal);}
.field .unit{font-size:12px;color:var(--text-dim);margin-top:4px;text-align:center;}

/* Quick-pick tabs */
.tabs-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab-btn{background:var(--navy-card);border:1px solid var(--border);border-radius:20px;color:var(--text-dim);font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:#000;}

/* Results */
.results-card{background:var(--navy-card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;}
.results-card.highlight{border-color:var(--teal);}
.result-section-title{font-size:13px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.result-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.result-label{font-size:14px;color:var(--text-dim);flex:1;}
.result-val{font-size:22px;font-weight:800;color:var(--text);min-width:60px;text-align:right;}
.result-unit{font-size:13px;color:var(--text-dim);}
.result-note{font-size:12px;color:var(--text-dim);}
.result-note-block{background:#0d1e3a;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--text-dim);line-height:1.5;}
.result-note-block strong{color:var(--text);}
.result-formula{font-size:11px;color:var(--text-dim);margin-top:2px;}
.result-warn{background:#2a1a0a;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:6px;font-size:12px;color:#ffd080;}

.no-result{color:var(--text-dim);text-align:center;padding:32px 0;font-size:15px;}

/* ETT size table */
.size-table{width:100%;border-collapse:collapse;margin-top:8px;}
.size-table th{font-size:11px;font-weight:700;color:var(--text-dim);text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);}
.size-table td{font-size:13px;padding:7px 8px;border-bottom:1px solid #1a2d50;}
.size-table tr.active-row td{background:#0d2a1f;color:var(--green);font-weight:700;}
.size-table td:first-child{color:var(--text-dim);}

.divider{height:1px;background:var(--border);margin:12px 0;}
</style>
<link rel="stylesheet" href="ios.css">
<script src="pwa.js" defer></script>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">‹ Back</a>
  <span class="page-title">ETT &amp; UVC Calculator</span>
</div>

<div class="content">

  <div class="section-label">Quick Pick</div>
  <div class="tabs-label">Select a common weight/GA:</div>
  <div class="tabs">
    <button class="tab-btn" onclick="setPreset(0.5,23)">23w 500g</button>
    <button class="tab-btn" onclick="setPreset(0.6,24)">24w 600g</button>
    <button class="tab-btn" onclick="setPreset(0.75,25)">25w 750g</button>
    <button class="tab-btn" onclick="setPreset(1.0,28)">28w 1.0kg</button>
    <button class="tab-btn" onclick="setPreset(1.5,32)">32w 1.5kg</button>
    <button class="tab-btn" onclick="setPreset(2.0,34)">34w 2.0kg</button>
    <button class="tab-btn" onclick="setPreset(3.0,38)">38w 3.0kg</button>
    <button class="tab-btn" onclick="setPreset(3.5,40)">40w 3.5kg</button>
  </div>

  <div class="section-label">Enter Weight &amp; Gestation</div>
  <div class="input-card">
    <div class="input-row">
      <div class="field">
        <label>Weight</label>
        <input type="number" id="wt" placeholder="0.0" step="0.1" min="0.3" max="6" oninput="calc()" inputmode="decimal">
        <div class="unit">kg</div>
      </div>
      <div class="field">
        <label>Gestation</label>
        <input type="number" id="ga" placeholder="28" step="1" min="22" max="44" oninput="calc()" inputmode="numeric">
        <div class="unit">weeks</div>
      </div>
    </div>
  </div>

  <div id="results"><div class="no-result">📏 Enter weight and gestation above</div></div>

</div>

<script>
function setPreset(w,g){
  document.getElementById('wt').value=w;
  document.getElementById('ga').value=g;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  calc();
}

function calc(){
  const w=parseFloat(document.getElementById('wt').value);
  const ga=parseFloat(document.getElementById('ga').value);
  const el=document.getElementById('results');

  if(!w||w<=0){
    el.innerHTML='<div class="no-result">📏 Enter weight and gestation above</div>';
    return;
  }

  // ── ETT size ──────────────────────────────────────────────────────────────
  let ettSize, ettNote='';
  if(w<0.8){ettSize='2.0*'; ettNote='*Consider 2.0 mm for &lt;800g / &lt;26w';}
  else if(w<1.0){ettSize='2.5';}
  else if(w<=2.0){ettSize='3.0';}
  else{ettSize='3.5';}

  // Suction catheter
  let sxSize='';
  if(w<1.0)sxSize='5F';
  else if(w<=2.0)sxSize='6F';
  else sxSize='6F or 8F';

  // ── ETT oral insertion depth ───────────────────────────────────────────────
  // ≥1 kg: weight (kg) + 6 cm
  // <1 kg: 6 − (1 − weight) = 5 + weight
  const roundHalf = n => Math.round(n * 2) / 2;
  const ettDepth_oral = w >= 1.0
    ? roundHalf(w + 6).toFixed(1)
    : roundHalf(6 - (1 - w)).toFixed(1);
  const ettDepth_formula = w >= 1.0
    ? 'Weight (kg) + 6 cm · rounded to nearest 0.5 cm'
    : '6 − (1 − Weight kg) · rounded to nearest 0.5 cm';

  // ── UVC emergency insertion ────────────────────────────────────────────────
  // Advance catheter only 1–2 cm past point of initial blood return.
  // Typical total depth achieved: 3–5 cm (term) or 2–4 cm (preterm <37w)
  const uvcIsPreterm = !ga || ga < 37;
  const uvcRange = uvcIsPreterm ? '2–4 cm' : '3–5 cm';
  const uvcType  = uvcIsPreterm ? 'preterm' : 'term';

  // ── LMA ───────────────────────────────────────────────────────────────────
  let lmaSize='—', lmaNote='';
  if(ga&&ga>=34&&w>1.5){lmaSize='1'; lmaNote='≥34 weeks + >1.5 kg';}
  else{lmaNote='Not indicated: <34w or ≤1.5 kg';}

  // ── OG tube ───────────────────────────────────────────────────────────────
  let ogSize='';
  if(w<1.5)ogSize='5F';
  else ogSize='6F (8F acceptable in term)';

  // ── Active row in size table ───────────────────────────────────────────────
  const rows=[
    {wt:'<800g', ett:'2.0*', sx:'5F', gaLabel:'<26w'},
    {wt:'<1000g', ett:'2.5',  sx:'5F', gaLabel:'<28w'},
    {wt:'1–2 kg', ett:'3.0',  sx:'6F', gaLabel:'28–34w'},
    {wt:'>2 kg',  ett:'3.5',  sx:'6 or 8F', gaLabel:'>34w'},
  ];
  let activeIdx=3;
  if(w<0.8)activeIdx=0;
  else if(w<1.0)activeIdx=1;
  else if(w<=2.0)activeIdx=2;

  const tableRows=rows.map((r,i)=>`
    <tr class="${i===activeIdx?'active-row':''}">
      <td>${r.wt}</td><td>${r.ett}</td><td>${r.sx}</td><td>${r.gaLabel}</td>
    </tr>`).join('');

  // ── Render ─────────────────────────────────────────────────────────────────
  el.innerHTML=`

    <!-- ETT size -->
    <div class="results-card highlight">
      <div class="result-section-title">ETT Size</div>
      <div class="result-row">
        <span class="result-label">Tube ID</span>
        <span class="result-val">${ettSize}</span>
        <span class="result-unit">mm</span>
      </div>
      <div class="result-row">
        <span class="result-label">Suction catheter</span>
        <span class="result-val" style="font-size:18px">${sxSize}</span>
      </div>
      ${ettNote?`<div class="result-warn">${ettNote}</div>`:''}
      <div class="divider"></div>
      <table class="size-table">
        <thead><tr><th>Weight</th><th>ETT (mm)</th><th>Suction</th><th>GA</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>

    <!-- ETT oral depth -->
    <div class="results-card">
      <div class="result-section-title">Oral Insertion Depth</div>
      <div class="result-row">
        <span class="result-label">Depth at lip</span>
        <span class="result-val">${ettDepth_oral}</span>
        <span class="result-unit">cm</span>
      </div>
      <div class="result-formula">${ettDepth_formula}</div>
      <div class="result-note-block">
        <strong>Nasal ETT:</strong> Use nasal-tragus length (NTL) + 1 cm.<br>
        Verify position by auscultation of both axillae after insertion.
        Reduced left air entry = right mainstem → withdraw 0.5 cm.
      </div>
    </div>

    <!-- UVC -->
    <div class="results-card">
      <div class="result-section-title">UVC — Emergency Insertion</div>
      <div class="result-row">
        <span class="result-label">Typical depth</span>
        <span class="result-val" style="font-size:20px">${uvcRange}</span>
        <span class="result-unit">cm (${uvcType})</span>
      </div>
      <div class="result-note-block">
        Advance catheter <strong>1–2 cm past the point of initial blood return</strong> only.<br>
        High-position placement is <strong>NOT required</strong> during resuscitation.<br>
        Confirm free blood return → secure with cord tie → flush with NS before any drug.
      </div>
    </div>

    <!-- LMA -->
    <div class="results-card">
      <div class="result-section-title">LMA</div>
      <div class="result-row">
        <span class="result-label">Size</span>
        <span class="result-val">${lmaSize}</span>
      </div>
      <div class="result-note">${lmaNote}</div>
      ${lmaSize==='1'?`<div class="result-note-block">Insert with cuff partially deflated. Advance along hard palate until resistance. Inflate cuff to seal. Cannot be used for tracheal suctioning or intra-tracheal medication.</div>`:''}
    </div>

    <!-- OG tube -->
    <div class="results-card">
      <div class="result-section-title">OG Tube</div>
      <div class="result-row">
        <span class="result-label">Size</span>
        <span class="result-val" style="font-size:18px">${ogSize}</span>
      </div>
      <div class="result-note-block">
        Insert after >2 minutes of PPV (mask or ETT).<br>
        Measure: nasal bridge → earlobe → midway between xiphisternum and umbilicus.<br>
        Leave on open drainage or aspirate with 20 mL syringe.
      </div>
    </div>

  `;
}
</script>
</body>
</html>
