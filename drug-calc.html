<style>
:root{
  --navy:#0a1628;--navy-mid:#122040;--navy-card:#1a2d50;
  --blue:#3b9eff;--teal:#00d4b4;--red:#ff4d6a;--amber:#ffb340;--green:#34d399;
  --text:#e8f0fe;--text-dim:#8da4c4;--border:#243860;
  --radius:14px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.topbar{display:flex;align-items:center;gap:12px;background:var(--navy-mid);border-bottom:1px solid var(--border);padding:48px 16px 14px;position:sticky;top:0;z-index:100;}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--navy-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--blue);font-size:18px;flex-shrink:0;}
.topbar-title{font-size:17px;font-weight:700;color:#fff;}
.topbar-sub{font-size:11px;color:var(--text-dim);}
.content{padding:16px;}

/* Weight input */
.weight-card{
  background:var(--navy-card);border:2px solid var(--red);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;
}
.weight-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
.weight-row{display:flex;align-items:center;gap:10px;}
.weight-input{
  flex:1;background:var(--navy-mid);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;font-size:28px;font-weight:800;color:#fff;
  text-align:center;outline:none;width:100%;
  -moz-appearance:textfield;
}
.weight-input::-webkit-inner-spin-button,
.weight-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.weight-unit{font-size:16px;font-weight:700;color:var(--text-dim);}

/* Presets */
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.preset{
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--navy-mid);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;
}
.preset:active{background:var(--navy-card);}

/* Drug cards */
.drug-section-label{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);margin:16px 0 8px;
}
.drug-card{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.drug-head{
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.drug-badge{
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.drug-name{font-size:14px;font-weight:700;color:#fff;}
.drug-conc{font-size:11px;color:var(--text-dim);margin-top:1px;}
.drug-body{padding:12px 16px;}

.dose-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.dose-row:last-child{border-bottom:none;}
.dose-label{font-size:12.5px;color:var(--text-dim);}
.dose-value{font-size:22px;font-weight:800;color:#fff;text-align:right;}
.dose-unit{font-size:12px;color:var(--text-dim);text-align:right;}

.dose-range{
  font-size:11px;color:var(--text-dim);margin-top:3px;text-align:right;
}

.prep-box{
  background:var(--navy-mid);border-radius:10px;padding:10px 12px;
  font-size:12px;color:var(--text-dim);line-height:1.6;margin-top:8px;
}
.prep-box strong{color:var(--text);}

.warning-inline{
  background:rgba(255,77,106,.08);border:1px solid rgba(255,77,106,.25);border-radius:8px;
  padding:8px 10px;font-size:12px;color:var(--red);line-height:1.5;margin-top:8px;
}

.no-weight{
  text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;
}
.no-weight-icon{font-size:40px;margin-bottom:12px;}

.bottom-safe{height:calc(20px + var(--safe-bottom));}

/* colour helpers */
.d-red .drug-badge{background:rgba(255,77,106,.15);} 
.d-blue .drug-badge{background:rgba(59,158,255,.15);}
.d-teal .drug-badge{background:rgba(0,212,180,.15);}
.d-amber .drug-badge{background:rgba(255,179,64,.15);}
</style>
<link rel="stylesheet" href="ios.css">
<script src="pwa.js" defer></script>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html">←</a>
  <div>
    <div class="topbar-title">Drug Calculator</div>
    <div class="topbar-sub">Weight-based neonatal doses · MyNeST</div>
  </div>
</div>

<div class="content">
  <div class="weight-card">
    <div class="weight-label">⚖ Enter Baby Weight</div>
    <div class="weight-row">
      <input class="weight-input" type="number" id="wt" placeholder="0.0" min="0.3" max="6" step="0.1" oninput="calc()" inputmode="decimal">
      <div class="weight-unit">kg</div>
    </div>
    <div class="preset-row">
      <div class="preset" onclick="setW(0.8)">800 g</div>
      <div class="preset" onclick="setW(1.0)">1.0 kg</div>
      <div class="preset" onclick="setW(1.5)">1.5 kg</div>
      <div class="preset" onclick="setW(2.0)">2.0 kg</div>
      <div class="preset" onclick="setW(2.5)">2.5 kg</div>
      <div class="preset" onclick="setW(3.0)">3.0 kg</div>
      <div class="preset" onclick="setW(3.5)">3.5 kg</div>
      <div class="preset" onclick="setW(4.0)">4.0 kg</div>
    </div>
  </div>

  <div id="results">
    <div class="no-weight">
      <div class="no-weight-icon">💊</div>
      Enter baby weight above to calculate doses
    </div>
  </div>
</div>
<div class="bottom-safe"></div>

<script>
function setW(v){
  document.getElementById('wt').value=v;
  calc();
}

function fmt(n){let s=n.toFixed(1);return s.endsWith('.0')?s.slice(0,-2):s;}

function calc(){
  const w=parseFloat(document.getElementById('wt').value);
  const el=document.getElementById('results');
  if(!w||w<=0||w>8){
    el.innerHTML='<div class="no-weight"><div class="no-weight-icon">💊</div>Enter baby weight above to calculate doses</div>';
    return;
  }

  // Adrenaline
  const adIVlow=0.1*w;  // mL (0.01mg/kg at 1:10k)
  const adIVhigh=0.3*w; // mL (0.03mg/kg at 1:10k)
  const adETlow=0.5*w;  // mL (0.05mg/kg at 1:10k)
  const adEThigh=1.0*w; // mL (0.1mg/kg at 1:10k)

  // Volume expander
  const ns10=10*w;

  // Glucose (10% dextrose 2mL/kg)
  const gluc=2*w;

  el.innerHTML=`
    <div class="drug-section-label">Emergency Medications</div>

    <div class="drug-card d-red">
      <div class="drug-head">
        <div class="drug-badge">💉</div>
        <div>
          <div class="drug-name">Adrenaline (Epinephrine)</div>
          <div class="drug-conc">Concentration: 1:10,000 = 0.1 mg/mL</div>
        </div>
      </div>
      <div class="drug-body">
        <div class="dose-row">
          <div>
            <div class="dose-label">IV / IO Route <span style="font-size:10px;background:rgba(52,211,153,.2);color:#34d399;border-radius:4px;padding:1px 5px;margin-left:4px;">PREFERRED</span></div>
            <div class="dose-range">0.01–0.03 mg/kg</div>
          </div>
          <div>
            <div class="dose-value">${fmt(adIVlow)}–${fmt(adIVhigh)}</div>
            <div class="dose-unit">mL of 1:10,000</div>
          </div>
        </div>
        <div class="dose-row">
          <div>
            <div class="dose-label">ETT Route (if no IV access)</div>
            <div class="dose-range">0.05–0.1 mg/kg</div>
          </div>
          <div>
            <div class="dose-value">${fmt(adETlow)}–${fmt(adEThigh)}</div>
            <div class="dose-unit">mL of 1:10,000</div>
          </div>
        </div>
        <div class="prep-box">
          <strong>Preparing 1:10,000 from 1:1,000 ampule:</strong><br>
          Draw <strong>1 mL of 1:1,000</strong> + <strong>9 mL of NS 0.9%</strong> → 10 mL of 1:10,000<br>
          Label: "Adrenaline 1:10,000 — 0.1 mg/mL · Date · Time"<br>
          <strong>IV dose for ${fmt(w)} kg (0.02 mg/kg midpoint):</strong> ${fmt(0.2*w)} mL · Flush 3 mL NS<br>
          <strong>ETT:</strong> follow with 3 PPV breaths before resuming CPR.
        </div>
        <div class="warning-inline">Indication: HR &lt;60 after 30 sec effective PPV + 60 sec coordinated CPR. Via UVC preferred — always follow ETT dose with IV as soon as access established.</div>
      </div>
    </div>

    <div class="drug-card d-blue">
      <div class="drug-head">
        <div class="drug-badge">🩹</div>
        <div>
          <div class="drug-name">Volume Expander</div>
          <div class="drug-conc">Normal Saline 0.9% · 10 mL/kg over 5–10 min</div>
        </div>
      </div>
      <div class="drug-body">
        <div class="dose-row">
          <div>
            <div class="dose-label">NS 0.9% bolus</div>
            <div class="dose-range">10 mL/kg over 5–10 min</div>
          </div>
          <div>
            <div class="dose-value">${fmt(ns10)}</div>
            <div class="dose-unit">mL</div>
          </div>
        </div>
        <div class="warning-inline">Indication: suspected hypovolaemia — pallor, weak pulses, CRT &gt;3 sec, history of blood loss. <strong>Avoid rapid bolus in preterm &lt;32 weeks</strong> — high IVH risk. Give over 5–10 min via UVC.</div>
      </div>
    </div>

    <div class="drug-section-label">Post-Resuscitation</div>

    <div class="drug-card d-amber">
      <div class="drug-head">
        <div class="drug-badge">🍬</div>
        <div>
          <div class="drug-name">Glucose — Emergency Bolus</div>
          <div class="drug-conc">10% Dextrose · 2 mL/kg IV</div>
        </div>
      </div>
      <div class="drug-body">
        <div class="dose-row">
          <div>
            <div class="dose-label">10% dextrose IV</div>
            <div class="dose-range">2 mL/kg</div>
          </div>
          <div>
            <div class="dose-value">${fmt(gluc)}</div>
            <div class="dose-unit">mL</div>
          </div>
        </div>
        <div class="prep-box">Indicated if blood glucose &lt;2.6 mmol/L after resuscitation. Check glucose within 30 min of birth in high-risk infants (preterm, IUGR, IDM, perinatal asphyxia).</div>
      </div>
    </div>

    <div class="drug-card d-teal">
      <div class="drug-head">
        <div class="drug-badge">💉</div>
        <div>
          <div class="drug-name">Naloxone</div>
          <div class="drug-conc">0.1 mg/kg IM or IV · Opioid reversal only</div>
        </div>
      </div>
      <div class="drug-body">
        <div class="dose-row">
          <div>
            <div class="dose-label">Naloxone IM / IV</div>
            <div class="dose-range">0.1 mg/kg</div>
          </div>
          <div>
            <div class="dose-value">${fmt(0.1*w)}</div>
            <div class="dose-unit">mg</div>
          </div>
        </div>
        <div class="warning-inline">
          <strong>Indication:</strong> maternal opioid within 4 hours. <strong>Ventilate FIRST</strong> — naloxone is adjunctive. 
          <strong>Contraindicated</strong> if mother opioid-dependent (risk of neonatal withdrawal seizures).
        </div>
      </div>
    </div>

    <div style="background:rgba(59,158,255,.08);border:1px solid rgba(59,158,255,.2);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--text-dim);line-height:1.6;margin-top:4px;">
      <strong style="color:var(--blue);">Calculated for ${fmt(w)} kg</strong> · These doses are for trained MyNeST-certified personnel only. Verify independently before administration.
    </div>
  `;
}
</script>
</body>
</html>
